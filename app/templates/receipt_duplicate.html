{% extends "base.html" %}
{% block content %}
<h1>{% if lang=='ms' %}Resit sudah ada{% else %}Receipt already on record{% endif %}</h1>
<div class="card stack">
  <p class="error">{{ t('dup_warning') }}</p>
  {% if receipt_no %}<p class="note">{% if lang=='ms' %}No. resit{% else %}Receipt no.{% endif %}: <strong>{{ receipt_no }}</strong></p>{% endif %}
  <form method="post" action="/order/{{ order_no }}/receipt" enctype="multipart/form-data" class="stack">
    <input type="hidden" name="forced" value="1">
    <label for="files">{% if lang=='ms' %}Muat naik semula untuk hantar juga{% else %}Re-upload to submit anyway{% endif %}</label>
    <input id="files" name="files" type="file" accept="image/png,image/jpeg,application/pdf" multiple required>
    <button class="btn block" type="submit">{{ t('force_submit') }}</button>
  </form>
  <a class="btn ghost block" href="/order/{{ order_no }}">{{ t('back') }}</a>
</div>
{% endblock %}
