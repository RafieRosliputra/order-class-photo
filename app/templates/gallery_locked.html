{% extends "base.html" %}
{% block title %}{{ event.name }} — {{ t('brand') }}{% endblock %}
{% block content %}
<div class="locked-wrap">
  <form class="card stack locked-card" method="post" action="/e/{{ event.slug }}/unlock">
    <div class="locked-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 style="margin:0">{{ event.name }}</h1>
    <p class="muted" style="margin:0">{{ t('locked_lead') }}</p>
    {% if error %}<p class="error" role="alert" style="margin:0">{{ t(error) }}</p>{% endif %}
    <label for="ev-pw">{{ t('locked_pw') }}</label>
    <input id="ev-pw" name="password" type="password" autocomplete="off" required autofocus {{ 'disabled' if error == 'locked_many' }}>
    <button class="btn block" type="submit" {{ 'disabled' if error == 'locked_many' }}>{{ t('locked_btn') }}</button>
    <p class="note" style="margin:0">{{ t('locked_help') }}</p>
  </form>
</div>
{% endblock %}
