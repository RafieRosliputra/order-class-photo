{% extends "base.html" %}
{% block title %}New event — Admin{% endblock %}
{% block content %}
<h1>New event</h1>
<form method="post" action="/admin/events/new" class="card stack">
  <div class="field"><label>Name</label><input name="name" required placeholder="Konvokesyen Tadika X 2026"></div>
  <div class="grid2">
    <div class="field"><label>Event date</label><input name="event_date" type="date"></div>
    <div class="field"><label>Order close date</label><input name="close_date" type="date"></div>
  </div>
  <div class="field"><label>Nextcloud</label>
    <select name="nextcloud_id" id="nc-instance">
      {% for i in instances %}<option value="{{ i.id }}">{{ i.label }}</option>{% endfor %}
    </select>
    {% if not instances %}<span class="note">Tiada Nextcloud dikonfigur (set NEXTCLOUD_INSTANCES).</span>{% endif %}
  </div>
  <div class="field"><label>Folder event (subfolder = kelas)</label>
    <div class="row" style="gap:8px">
      <input name="nextcloud_folder" id="nc-folder" placeholder="Pilih folder…">
      <button type="button" class="btn ghost sm" id="nc-browse-btn">Browse</button>
    </div>
    <div id="nc-panel" class="card hidden" style="margin-top:8px">
      <div class="spread"><span class="note" id="nc-cur">/</span>
        <button type="button" class="btn sm" id="nc-pick">Pilih folder ini</button></div>
      <div id="nc-list"></div>
    </div>
  </div>
  <div class="field"><label>Class folder delimiter ("SCHOOL - CLASS")</label>
    <input name="class_delimiter" value=" - "></div>
  <div class="field"><label>Pickup location (school)</label><input name="pickup_location"></div>
  <div class="grid2">
    <div class="field"><label>Bank Muamalat account no.</label><input name="pay_bank_no"></div>
    <div class="field"><label>QRPay image URL (optional)</label><input name="pay_qrpay_image" placeholder="/static/img/qrpay.png"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>Postage West (RM)</label><input name="postage_west" value="10"></div>
    <div class="field"><label>Postage Sabah/Sarawak (RM)</label><input name="postage_east" value="18"></div>
  </div>
  <button class="btn" type="submit">Create</button>
</form>
{% endblock %}
{% block scripts %}<script src="/static/js/ncbrowse.js" defer></script>{% endblock %}
