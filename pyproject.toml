[project]
name = "johorstudio-photo-order"
version = "0.1.0"
description = "Johor Studio — event photo ordering web app (manual payment). Parents browse, pick prints, pay manually, upload receipt (OCR-verified)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "pdf2image>=1.17.0",
    "qrcode>=7.4.2",
    "gspread>=6.1.2",
    "google-auth>=2.34.0",
    "aiosmtplib>=3.0.1",
    "apscheduler>=3.10.4",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
# PaddleOCR is heavy (pulls paddlepaddle). Install on the server that runs OCR:
#   uv sync --extra ocr
ocr = [
    "paddleocr>=2.8.1",
    "paddlepaddle>=2.6.1",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
